name: Build Aurora Keyboard APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'AuroraKeyboard-SwiftTyping-v0.2-source.zip'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Extract Aurora Android project
        run: |
          test -f AuroraKeyboard-SwiftTyping-v0.2-source.zip || { echo 'Upload AuroraKeyboard-SwiftTyping-v0.2-source.zip to the repository root first.'; exit 1; }
          unzip -q AuroraKeyboard-SwiftTyping-v0.2-source.zip -d extracted
          test -f extracted/AuroraKeyboard/settings.gradle.kts || { echo 'Expected AuroraKeyboard/settings.gradle.kts inside ZIP'; exit 1; }
      - name: Build installable debug APK
        working-directory: extracted/AuroraKeyboard
        run: |
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AuroraKeyboard-SwiftTyping-v0.2-apk
          path: extracted/AuroraKeyboard/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
