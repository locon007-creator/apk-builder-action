name: Build Velora Browser APK
on:
  push:
    branches: [main]
    paths:
      - 'velora11/patch-*'
      - '.github/workflows/build-velora.yaml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Reconstruct Velora 1.0 source
        run: |
          cat velora/chunk-* > velora-source.b64
          base64 -d velora-source.b64 > velora-source.zip
          unzip -t velora-source.zip
          rm -rf velora-work
          mkdir velora-work
          unzip -q velora-source.zip -d velora-work
      - name: Apply Velora 1.1 upgrade
        run: |
          cat velora11/patch-* > velora11.patch
          cd velora-work/VeloraBrowser
          patch -p2 < ../../velora11.patch
      - name: Build debug APK
        working-directory: velora-work/VeloraBrowser
        run: |
          gradle wrapper
          chmod +x gradlew
          yes | sdkmanager --licenses >/dev/null || true
          ./gradlew assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: Velora-Browser-1.1-APK
          path: velora-work/VeloraBrowser/app/build/outputs/apk/debug/*.apk
          retention-days: 1
