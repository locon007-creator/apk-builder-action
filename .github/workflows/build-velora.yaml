name: Build Velora Browser APK
on:
  push:
    branches: [main]
    paths:
      - 'velora-source.zip'
      - '.github/workflows/build-velora.yaml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Unpack Velora
        run: |
          rm -rf velora-work
          mkdir velora-work
          unzip -q velora-source.zip -d velora-work
      - name: Build debug APK
        working-directory: velora-work/VeloraBrowser
        run: |
          gradle wrapper
          chmod +x gradlew
          yes | sdkmanager --licenses >/dev/null || true
          ./gradlew assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: Velora-Browser-APK
          path: velora-work/VeloraBrowser/app/build/outputs/apk/debug/*.apk
          retention-days: 1
