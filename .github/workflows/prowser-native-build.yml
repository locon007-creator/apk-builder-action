name: Build Prowser Native Upgrade
on:
  push:
    branches: [prowser-upgrade-build]
    paths:
      - 'prowser-native-trigger.txt'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build Prowser
        working-directory: prowser_native
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Prowser-v1.1-APK
          path: prowser_native/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
