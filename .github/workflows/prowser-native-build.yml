name: Build Prowser Native Upgrade
on:
  push:
    branches: [main]
    paths:
      - 'prowser-native-trigger.txt'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build Prowser
        working-directory: prowser_native
        shell: bash
        run: |
          set +e
          set -o pipefail
          gradle :app:assembleDebug --stacktrace 2>&1 | tee ../prowser-build.log
          STATUS=${PIPESTATUS[0]}
          echo "exit_code=$STATUS" > ../prowser-build-result.txt
          exit $STATUS
      - name: Prepare APK
        run: cp prowser_native/app/build/outputs/apk/debug/app-debug.apk Prowser-v1.4.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Prowser-v1.4-APK
          path: Prowser-v1.4.apk
          if-no-files-found: error
      - name: Publish temporary release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete prowser-v1.4-build -y --cleanup-tag || true
          gh release create prowser-v1.4-build Prowser-v1.4.apk --target main --title "Prowser v1.4 Build" --notes "Temporary build artifact for Prowser v1.4."
      - name: Record successful build
        run: |
          printf "run_id=%s\nrelease=https://github.com/locon007-creator/apk-builder-action/releases/download/prowser-v1.4-build/Prowser-v1.4.apk\n" "$GITHUB_RUN_ID" > prowser-build-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prowser-build-status.txt
          git commit -m "Record successful Prowser v1.4 build"
          git push origin HEAD:main

      - name: Record build diagnostics
        if: always()
        run: |
          {
            cat prowser-build-result.txt 2>/dev/null || echo "exit_code=unknown"
            echo "run_id=$GITHUB_RUN_ID"
            echo "--- tail ---"
            tail -n 160 prowser-build.log 2>/dev/null || true
          } > prowser-build-diagnostics.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prowser-build-diagnostics.txt
          git commit -m "Record Prowser build diagnostics" || true
          git push origin HEAD:main || true
