name: Build Prowser Native Upgrade
on:
  push:
    branches: [prowser-upgrade-build]
    paths:
      - 'prowser-native-trigger.txt'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build Prowser
        working-directory: prowser_native
        run: gradle :app:assembleDebug --stacktrace
      - name: Prepare APK
        run: cp prowser_native/app/build/outputs/apk/debug/app-debug.apk Prowser-v1.1.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Prowser-v1.1-APK
          path: Prowser-v1.1.apk
          if-no-files-found: error
      - name: Publish temporary release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete prowser-v1.1-build -y --cleanup-tag || true
          gh release create prowser-v1.1-build Prowser-v1.1.apk --target prowser-upgrade-build --title "Prowser v1.1 Build" --notes "Temporary build artifact for Prowser v1.1."
      - name: Record successful build
        run: |
          printf "run_id=%s\nrelease=https://github.com/locon007-creator/apk-builder-action/releases/download/prowser-v1.1-build/Prowser-v1.1.apk\n" "$GITHUB_RUN_ID" > prowser-build-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prowser-build-status.txt
          git commit -m "Record successful Prowser v1.1 build"
          git push origin HEAD:prowser-upgrade-build
