name: Smart Timesheet Clean APK

on:
  push:
    branches:
      - smart-timesheet-clean-build
    paths:
      - 'smart-timesheet-clean/**'
      - '.github/workflows/smart-timesheet-clean-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smart-timesheet-clean
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Timesheet-APK
          path: smart-timesheet-clean/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
