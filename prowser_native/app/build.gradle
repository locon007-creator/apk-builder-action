plugins { id 'com.android.application' }

android {
    namespace 'ai.arena.prowser'
    compileSdk 35

    defaultConfig {
        applicationId 'ai.arena.prowser'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '1.4'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
